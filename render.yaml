services:
  - type: web
    name: hiring-wallah-backend
    env: python
    region: singapore # You can change this to your preferred region (e.g. ohio, frankfurt)
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hiring-wallah-db
          property: connectionString
      # Important: You must add GEMINI_API_KEY manually in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      # Important: Add the Firebase credentials manually in the Render dashboard
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

databases:
  - name: hiring-wallah-db
    databaseName: hiring_wallah
    user: admin
    plan: free
    region: singapore # Should match the web service region
